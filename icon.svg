<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing rim -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#glowGrad)" stroke-width="4"/>

  <!-- Golden 3D Coin Badge -->
  <g filter="url(#shadow)">
    <!-- Main Coin -->
    <circle cx="256" cy="220" r="130" fill="url(#goldGrad)"/>
    <circle cx="256" cy="220" r="110" fill="none" stroke="#fef08a" stroke-width="6" opacity="0.6"/>
    
    <!-- Coin Icon: Stylized F & Wallet Diamond -->
    <path d="M210 150 L300 150 C315 150 325 160 325 175 C325 190 315 200 300 200 L245 200 L245 230 L290 230 C302 230 310 238 310 250 C310 262 302 270 290 270 L245 270 L245 295 C245 305 238 312 228 312 C218 312 210 305 210 295 Z" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
  </g>

  <!-- Sparkles -->
  <polygon points="390,130 400,105 410,130 435,140 410,150 400,175 390,150 365,140" fill="#fef08a"/>
  <polygon points="110,290 118,270 126,290 146,298 126,306 118,326 110,306 90,298" fill="#818cf8"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">FINMASTER</text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="2">OFFLINE EDITION</text>
</svg>
